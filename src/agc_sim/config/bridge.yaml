# ros_gz_bridge 声明式桥配置（W2-min 最小集）
#
# 由 world_bringup.launch.py 经 ros_gz_bridge 的 parameter_bridge 以 config_file 加载。
# QoS 与类型映射的标定说明见 src/agc_sim/README.md（W2 吸收点：sensor QoS / 类型映射，对齐 Nav2）。

# 仿真时钟（GZ→ROS）
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# 地面车里程计（GZ DiffDrive 插件输出 → ROS 原始 odom；由 M0 的 ground_odom_adapter 归一）
- ros_topic_name: "/agc/sim/ground_odom_raw"
  gz_topic_name: "/model/agc_car/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# 注：世界真值位姿旁路（gt）**不在 W2-min**，且**不经本桥**。
# gz `/world/agc_world/dynamic_pose/info`（gz.msgs.Pose_V）可在 gz 侧读到实体名与位姿，
# 但本机 ros_gz_bridge(1.0.24) 的 Pose_V→tf2_msgs/TFMessage 转换不写入 frame 名
# （frame_id / child_frame_id 均为空），无法作为带名真值使用。
# 真值旁路由 **W4 的专用节点 `gt_bypass`** 经 gz-transport 直读该话题实现
# （发布 `/agc/gt/<entity>`）。故本桥不再桥接逐实体 PosePublisher 话题
# （原 `/agc/sim/{car,target}_pose` 已在 W4 退役）。

# 车体 3D 激光点云（W2-full）
# sensor 的 <topic>/agc/car_lidar</topic> → gz 点云发布在 /agc/car_lidar/points
# （另有一条 /agc/car_lidar 的 LaserScan，本 workstream 不桥）
- ros_topic_name: "/agc/sim/car_points"
  gz_topic_name: "/agc/car_lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# 车体 3D 激光的水平扫描（2D LaserScan；W5 安全层 collision_monitor 的 `scan` 源，对齐 Nav2 官方示例）
- ros_topic_name: "/agc/ground/scan"
  gz_topic_name: "/agc/car_lidar"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# R-027（ADR-0042）：地面车接触真值（GZ contact sensor → ROS）。
# 车模 agc_car.sdf.xacro 的 car/base_link 挂 contact sensor（监测 base_collision 与其它碰撞体）。
# **实测**（gz topic -l）：gz-sim-contact-system 的话题由其作用域名决定，**不**取 SDF <topic> 值——
# 实际为 /world/agc_world/model/agc_car/link/car/base_link/sensor/contact/contact（本条目据实采用）。
# 检测到接触时发布 gz.msgs.Contacts，桥为 ros_gz_interfaces/Contacts；仅供 run_logger 记
# **真实碰撞事件**（R-027），非命令者、不改冻结 9 消息 ABI。
- ros_topic_name: "/agc/ground/contact"
  gz_topic_name: "/world/agc_world/model/agc_car/link/car/base_link/sensor/contact/contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS

# 地面车速度命令（ROS→GZ；由 M0 的执行中继发布）
# R-009（ADR-0025）：ROS 侧话题名**不变**（/model/agc_car/cmd_vel，中继与验收脚本照旧），
# 但 gz 侧改桥到「意图」话题 /agc/sim/cmd_intent；GZ 侧的 agc_cmd_deadman 插件订阅该意图，
# fresh→转发、stale→归零，再写 DiffDrive 默认订阅的 gz 话题 /model/agc_car/cmd_vel。
# 即：DiffDrive 命令口（gz /model/agc_car/cmd_vel）的唯一写入者是插件（本桥不再直写）。
- ros_topic_name: "/model/agc_car/cmd_vel"
  gz_topic_name: "/agc/sim/cmd_intent"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# 目标无人机速度命令桥**已退役**（W6 前置 P，见 .trae/specs/w6-task-eval/spec.md 前置 P）：
# `intruder_uav` 改由**第二 PX4 SITL 实例**经 uXRCE / `px4_msgs` 驱动
# （`agc_task/intruder_driver`），不复用 gz VelocityControl 通道。

# 注：场景复位服务 /world/agc_world/set_pose 的桥**不在本 YAML 内**。
# 本机 ros_gz_bridge(1.0.24) 的 YAML 服务条目（service_name/gz_req_type_name/
# gz_rep_type_name）在 factory 侧会因空 topic 名崩溃；该服务改由 world_bringup.launch.py
# 以 CLI 形式桥接（等价配置）：
#   parameter_bridge /world/agc_world/set_pose@ros_gz_interfaces/srv/SetEntityPose
# 待桥版本支持 YAML 服务后迁回本文件。