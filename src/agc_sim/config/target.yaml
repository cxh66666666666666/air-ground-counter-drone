# intruder_uav（目标）参数（W2-min）
#
# 目标为被动刚体（失重、无插件）；本文件是其模型与 spawn 位的唯一参数来源。
# spawn：W3 打补丁后作业区放大到 80×80，目标与车分离 ~30 m（ADR-0019）。

agc_sim:
  target:
    spawn:
      x: 15.0
      y: 0.0
      z: 2.0
      yaw: 0.0
    model:
      body_length: 0.32
      body_width: 0.32
      body_height: 0.10
      body_mass: 1.0