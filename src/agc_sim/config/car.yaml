# agc_car 参数（W2-min）
#
# 本文件是地面车模型与 spawn 位的**唯一参数来源**；由 world_bringup.launch.py 读取，
# 经 launch 单一设置注入 xacro（节点不得覆写，见契约 #params）。
# 参数默认值以 ROS 官方 nav2_minimal_tb3_sim 的 TB3 waffle 为基座（见模型文件注释）。

agc_sim:
  car:
    # spawn 位姿（world 系，ENU）。对齐旧树 car_start = [-4 -3 ...]；
    # z 取 TB3 车身原点触地高度（轮半径 0.033 − 轮心局部 z 0.023 = 0.010）。
    spawn:
      x: -4.0
      y: -3.0
      z: 0.010
      yaw: 0.0
    # 模型几何 / 驱动参数（基座 TB3 waffle；mass 取旧树行为事实 2.0）
    model:
      wheel_separation: 0.287
      wheel_radius: 0.033
      wheel_width: 0.018
      max_wheel_torque: 20.0
      max_wheel_acceleration: 1.0
      body_length: 0.265
      body_width: 0.265
      body_height: 0.089
      body_mass: 2.0
      # 拦截载荷（W2-interception，R10）：轻量附件、无碰撞、不改动 DiffDrive 标定
      # 捕获网面半径（m）→ 直径 2 m；干扰载荷/网面附件质量（kg，可忽略）
      capture_net_radius: 1.0
      payload_mass: 0.05