# W6 场景族**基参数**（由 w6.launch.py（backend 参数化）与 config/scenarios.yaml 的场景覆盖合并后
# 单一注入；契约 #params）。节点不得覆写。
task_manager:
  ros__parameters:
    world_name: "agc_world"
    goal_topic: "/agc/ground/goal"
    goal_x: 4.0
    goal_y: 3.0
    goal_follow_target: false
    # R-041：目标失效策略 =「保留有期限的最后有效目标」。目标失效时在 goal_hold_valid_s 窗口内保持
    # 最后有效目标的**原位置 + 原源时刻**（不刷新 stamp、不反射固定点）；超窗显式失效（地面安全停车）。
    goal_hold_valid_s: 1.0
    # R-041：目标有效性 / 身份 / 时刻的伴随诊断话题（std_msgs/String，transient_local，非命令者）
    goal_info_topic: "/agc/ground/goal_info"
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    # 运行模式（R-001）：基参按"无空中链路"声明（backend:=lightweight 复用 m0_skeleton）；
    # backend:=full 起真实空中链路，在合并后强制覆写为 true（相位复位门禁 C5 强制）
    air_present: false
    ground_controller_name: "agc_rl"
    d_track_m: 3.0
    t_dwell_s: 3.0
    t_max_s: 120.0
    # R-013：复位后 odom_valid / 地面 odom 新鲜度上限（s）；cmd_vel 回环沿用 0.5（代码常量）
    odom_valid_max_age_s: 1.0
    # R-018：干扰终态只由「已确认事件」驱动（jammer 观测真实 nav_state 持续达标后发布）
    jam_confirm_topic: "/agc/task/jam_confirm"
    # R-021：episode 身份（epoch）+ 捕获配套事件结算话题（单一注入，节点不得覆写）
    epoch_topic: "/agc/scenario/reset_epoch"
    capture_event_topic: "/agc/task/capture_event"
    # R-022：命令幂等 / 终态锁存——reset 调用超时（s；超时/取消判非确定性，不误置状态）+
    # 新 episode 标识发布话题（std_msgs/Int32，transient_local，非命令者，供 R-021 配套事件关联）
    reset_call_timeout_s: 8.0
    episode_topic: "/agc/task/episode"
    # R-023：dwell 逐拍判据——车地面 odom 寿命门 + 分段有效时长事件（std_msgs，非命令者）
    car_odom_max_age_s: 1.0
    dwell_event_topic: "/agc/task/dwell_event"

scenario_reset:
  ros__parameters:
    world_name: "agc_world"
    state_topic: "/agc/task/state"
    car_start_topic: "/agc/scenario/car_start"
    car_x: -4.0
    car_y: -3.0
    car_z: 0.010
    car_yaw: 0.0
    target_x: 6.5
    target_y: 2.5
    target_z: 2.0
    target_yaw: 0.0
    # C7 出生净空下限（ADR-0023；旧值 2.4 m 作废）；R-014 起为**车↔目标对**下限（标定值）
    spawn_clearance_min_m: 6.0
    # R-014 出生净空统一候选校验（ADR-0029）：实体几何外伸（半长/半宽）暂定值，待实测回填
    clearance_radius_car_m: 0.5037
    clearance_radius_uav_m: 0.25
    clearance_radius_obstacle_m: 0.15
    # 实体对下限显式覆盖：< 0 表示按两实体外伸之和（r_a + r_b）推导
    clearance_min_car_own_uav_m: -1.0
    clearance_min_target_own_uav_m: -1.0
    clearance_min_car_obstacle_m: -1.0
    clearance_min_target_obstacle_m: -1.0
    # 作业区边界（map 系）与静态障碍清单**不**在此硬编码：由单一几何真源
    # `agc_sim/config/world_geometry.yaml` 经 composition（`w6_composition.compose_params`）
    # **派生注入** `map_x_min/x_max/y_min/y_max` 与 `obstacle_names/obstacle_x/obstacle_y`
    # （见 S-06 / ADR-0062）。scenario_reset.cpp 的默认值仅为 standalone 回退。
    # 显式运行模式（同 R-001 air_present 原则：不得由实体缺席推定）；backend:=full 透传己方机 spawn 位
    own_uav_present: false
    own_uav_x: 0.0
    own_uav_y: 0.0
    spawn_randomize: false
    spawn_seed: 0
    spawn_search_radius_m: 3.0
    # R-015（ADR-0030）复位受控事务：实体名 / 真值旁路 gt 话题 / epoch 话题 / 读回容差与超时 /
    # 静止观察窗口。**单一注入**（节点不得覆写，契约 #params）。
    car_entity_name: "agc_car"
    target_entity_name: "intruder_uav"
    car_gt_topic: "/agc/gt/agc_car"
    target_gt_topic: "/agc/gt/intruder_uav"
    reset_epoch_topic: "/agc/scenario/reset_epoch"
    ground_odom_topic: "/agc/ground/odom"
    readback_tolerance_m: 0.25
    readback_timeout_s: 1.0
    readback_max_age_s: 0.5
    stop_exec_max_s: 0.5
    quiescence_eps: 0.05

# R-016（ADR-0031）入侵者 episode 起点协议：契约 #params 单一注入（节点不得覆写）。
# 场景覆盖（motion/speed_mps/radius_m 等）由 config/scenarios.yaml 合并后透传（w6.launch.py 按 backend）。
intruder_driver:
  ros__parameters:
    px4_ns: "px4_1"
    target_system: 2
    motion: "static"
    alt_m: 2.0
    speed_mps: 1.0
    radius_m: 6.0
    rate_hz: 20.0
    arm_retry_s: 2.0
    # R-017：来源为 jammer 的**已校验授权事件**（非原始命令；driver 不直订原始干扰命令话题）
    jam_state_topic: "/agc/task/jam_state"
    epoch_topic: "/agc/scenario/reset_epoch"
    # 起点协议：进入起始位姿的稳定判定（距离 / 速度 / 驻留）
    start_tol_m: 0.4
    start_vel_eps_mps: 0.35
    start_dwell_s: 0.5
    # 运行区边界：setpoint 水平离原点上限（<=0 关闭）
    run_region_radius_m: 15.0

run_logger:
  ros__parameters:
    experiments_root: "/home/chen/AGC/experiments"
    git_root: "/home/chen/AGC"
    campaign: "w6-task-eval"
    scenario: "s00"
    seed: 0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    ground_odom_topic: "/agc/ground/odom"
    scan_topic: "/agc/ground/scan"
    collision_monitor_state_topic: "/collision_monitor_state"
    # R-027（ADR-0042）：接触真值话题（GZ contact sensor → ROS，ros_gz_interfaces/Contacts）；
    # 空字符串 = 接触真值不可用（not_applicable.collision_truth）；由 launch 单一注入（契约 #params）。
    contact_topic: "/agc/ground/contact"
    # R-027：锁轮制动减速度（m/s^2，ADR-0021(C) 实测锁轮制动）→ 剩余停车裕度 brake_d=v^2/(2a)
    a_brake_mps2: 0.9
    # R-028（ADR-0043）：有效样本掩码的采样新鲜度上限（s）——odom 拍与最近 scan / collision
    # action 快照年龄超过此值即该拍无效（陈旧 scan 不按新 odom 重复计数）。单一注入，节点不得覆写。
    scan_max_age_s: 0.5
    action_max_age_s: 0.5
    # R-029（ADR-0044）：episode 身份话题（std_msgs/Int32，transient_local；非命令者）。
    episode_topic: "/agc/task/episode"
    # R-029：世界模型文件（sha256 记入 config/toolchain_world.json；空 = 不记）。
    world_file: ""
    # R-029：可选 PX4 根（记其 HEAD 作工具链身份；空 = 不记）。
    px4_root: ""

capture_adjudicator:
  ros__parameters:
    ground_odom_topic: "/agc/ground/odom"
    target_topic: "/agc/targets"
    hit_topic: "/agc/task/capture_hit"
    # 捕获作用包络（R-020）：仍用网弹道（闭式占位）模型；与独立干扰包络分离
    envelope_topic: "/agc/task/envelope_in"
    # R-020：捕获证据 / 标注话题（命中 / 越界 / 不可达标注；std_msgs/String）
    capture_evidence_topic: "/agc/task/capture_evidence"
    rate_hz: 20.0
    # 网发射物理模型（可标定暂定值，实跑回填；包络由其可及集推导）
    net_v0_mps: 6.5
    net_angle_deg: 75.0
    net_g: 9.81
    net_diameter_m: 1.0
    net_drag: 0.9
    launcher_height_m: 0.0
    # R-020：模型身份与适用范围标签（占位口径，随证据 / 日志输出）
    model_id: "ballistic_closed_form"
    applicable_min_alt_m: 0.0
    # 上限 ≈ 当前默认点弹道解析顶点 (v0·sinθ)²/(2g) ≈ 2.009 m（占位；未计 t_exp 与网几何）
    applicable_max_alt_m: 2.009
    # R-020：独立干扰作用包络（与网弹道模型**不同源**；std_msgs/Bool，供 jammer 门控）
    jam_envelope_topic: "/agc/task/envelope_jam"
    jam_model_id: "behavioral_range_gate"
    jam_envelope_min_alt_m: 0.0
    jam_envelope_max_alt_m: 2.0
    jam_envelope_max_range_m: 1.0
    # R-021：任务窗口（仅 GROUND_APPROACH 内产出命中）+ 输入寿命 + episode 身份（单一注入，节点不得覆写）
    task_state_topic: "/agc/task/state"
    epoch_topic: "/agc/scenario/reset_epoch"
    # 配套事件（ep / 时刻 / target；std_msgs/String，非命令者，不改冻结 9 消息 ABI）
    capture_event_topic: "/agc/task/capture_event"
    car_max_age_s: 0.5
    target_max_age_s: 0.5
    confidence_min: 0.5
    # 空 = 不校验身份；非空 = 仅当 target_id 匹配才允许产出命中
    required_target_id: ""

jammer:
  ros__parameters:
    px4_ns: "px4_1"
    target_system: 2
    cmd_topic: "/agc/task/jam_cmd"
    state_topic: "/agc/task/jam_state"
    # R-020：干扰门控改用**独立干扰作用包络**（与捕获包络 /agc/task/envelope_in 分离）
    envelope_topic: "/agc/task/envelope_jam"
    # R-017：包络新鲜度上限（s）——过期视同包络外；仅「合法 + 包络新鲜」才产出已校验授权事件
    envelope_max_age_s: 0.5
    # R-018：真实行为确认（契约 #params 单一注入，节点不得覆写）——订入侵者 PX4 VehicleStatus，
    # 仅当真实 nav_state 达到所命令模式且持续 ≥ jam_sustain_s 才产出「已确认事件」
    vehicle_status_topic: "/px4_1/fmu/out/vehicle_status"
    confirm_topic: "/agc/task/jam_confirm"
    evidence_topic: "/agc/task/jam_evidence"
    jam_sustain_s: 1.0
    jam_confirm_window_s: 3.0
    # R-019：`LOST`（仅断 Offboard，**不**发 SET_NAV_STATE）的确认期望 nav_state。
    # = 运行时锁定 COM_OBL_RC_ACT 的映射（默认 0 = Position → POSCTL = 2）；真源见
    # config/px4_failsafe_lock.yaml（由 scripts/lock_px4_failsafe_params.sh 注入 SITL 启动参数）。
    lost_expected_nav_state: 2
