# W6 C9 验收配置（供 R7/R12）：车正对立柱 pole_1（world (0,-6)）前方 5 m、朝 -y 直行，
# 由 RL 主控驱动 → 安全层（collision_monitor）应在靠近立柱时触发 STOP/SLOWDOWN，
# run_logger 据此算出 shield_infeasible_rate（>0 表示"触发时不可行"事件存在）。
# 目标机远离作业点（出生净空充足）。
task_manager:
  ros__parameters:
    world_name: "agc_world"
    goal_topic: "/agc/ground/goal"
    goal_x: 0.0
    goal_y: -9.0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    # 运行模式（R-001）：本验收走 m0_skeleton（无空中链路）→ 显式声明无空中域
    air_present: false
    ground_controller_name: "agc_rl"
    t_max_s: 35.0

scenario_reset:
  ros__parameters:
    world_name: "agc_world"
    state_topic: "/agc/task/state"
    car_start_topic: "/agc/scenario/car_start"
    car_x: 0.0
    car_y: -1.0
    car_z: 0.010
    car_yaw: -1.5707963267948966
    target_x: 20.0
    target_y: 20.0
    target_z: 2.0
    target_yaw: 0.0
    spawn_clearance_min_m: 6.0

run_logger:
  ros__parameters:
    experiments_root: "/home/chen/AGC/experiments"
    git_root: "/home/chen/AGC"
    campaign: "w6-task-eval"
    scenario: "c9-shield"
    seed: 0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    ground_odom_topic: "/agc/ground/odom"
    scan_topic: "/agc/ground/scan"
    collision_monitor_state_topic: "/collision_monitor_state"
    contact_dist_m: 2.0
    ttc_min_s: 1.0
