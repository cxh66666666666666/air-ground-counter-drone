# M0 最小闭环参数（由 m0_skeleton.launch.py 单一注入；节点不得覆写）
# 见契约 #params —— launch 是参数唯一设置者。
#
# 注：ground_odom_adapter 自 W4 起由 agc_perception 的 perception_bringup 提供
# （位姿来源改为真值旁路 /agc/gt/agc_car），其参数在 agc_perception/config/perception.yaml。
# 注：地面链路（安全层 collision_monitor / 中继 / 命令源）自 W5 起由 agc_ground 的
# ground_bringup 提供，参数在 agc_ground/config/ground.yaml；本文件不再包含它们。

task_manager:
  ros__parameters:
    world_name: "agc_world"
    goal_topic: "/agc/ground/goal"
    goal_x: 4.0
    goal_y: 3.0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    # 运行模式（R-001）：M0 无空中链路 → 显式声明无空中域，相位复位门禁（C5）不适用
    air_present: false
    # 地面命令源名（W5：rl 主控 = agc_rl | 离线基线 = agc_ground）；随 command_source 切换
    ground_controller_name: "agc_rl"

scenario_reset:
  ros__parameters:
    world_name: "agc_world"
    state_topic: "/agc/task/state"
    car_start_topic: "/agc/scenario/car_start"
    car_x: -4.0
    car_y: -3.0
    car_z: 0.010
    car_yaw: 0.0
    target_x: 6.5
    target_y: 2.5
    target_z: 2.0
    target_yaw: 0.0

run_logger:
  ros__parameters:
    experiments_root: "/home/chen/AGC/experiments"
    git_root: "/home/chen/AGC"
    campaign: "m0-skeleton"
    scenario: "flat"
    seed: 0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"