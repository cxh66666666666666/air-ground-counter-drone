# W6 C9 验收配置（reset_failure_rate 非零）：车 (0,-1) 与目标 (0,0) 出生中心距 1.0 m <
# spawn_clearance_min_m=6.0 → scenario_reset 拒绝；task_manager 重试 ≤3 后仍失败 →
# reset_failed=true、reset_retries=3 → reset_failure_rate = 1.0、start 返回 INFRA_FAILURE。
task_manager:
  ros__parameters:
    world_name: "agc_world"
    goal_topic: "/agc/ground/goal"
    goal_x: 4.0
    goal_y: 3.0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    # 运行模式（R-001）：本验收走 m0_skeleton（无空中链路）→ 显式声明无空中域
    air_present: false
    ground_controller_name: "agc_rl"
    t_max_s: 20.0

scenario_reset:
  ros__parameters:
    world_name: "agc_world"
    state_topic: "/agc/task/state"
    car_start_topic: "/agc/scenario/car_start"
    car_x: 0.0
    car_y: -1.0
    car_z: 0.010
    car_yaw: 0.0
    target_x: 0.0
    target_y: 0.0
    target_z: 2.0
    target_yaw: 0.0
    spawn_clearance_min_m: 6.0

run_logger:
  ros__parameters:
    experiments_root: "/home/chen/AGC/experiments"
    git_root: "/home/chen/AGC"
    campaign: "w6-task-eval"
    scenario: "c9-resetfail"
    seed: 0
    odom_valid_topic: "/agc/ground/odom_valid"
    cmd_topic: "/agc/ground/cmd_vel"
    state_topic: "/agc/task/state"
    ground_odom_topic: "/agc/ground/odom"
    scan_topic: "/agc/ground/scan"
    collision_monitor_state_topic: "/collision_monitor_state"
    contact_dist_m: 2.0
    ttc_min_s: 1.0
