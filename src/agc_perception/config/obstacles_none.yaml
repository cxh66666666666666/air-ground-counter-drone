# 空障碍真值（R-026 承载 `obstacle=none`；S-06 半径路径由真源 `obstacle=none` 派生）
#
# 几何真源（S-06；ADR-0062）= `agc_sim/config/world_geometry.yaml`。本文件是 **standalone
# 回退副本**（`obstacle=none` 时的空静态先验），与真源在 none 轴下一致（空集）。
