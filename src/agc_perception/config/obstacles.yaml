# W4 感知用「障碍真值」几何（供 air_perception 生成 ObstacleObservation 与遮挡判定）
#
# ---- 几何真源（S-06；ADR-0062）----
# 静态障碍**实体几何**的唯一真源为 `agc_sim/config/world_geometry.yaml`。本文件是
# **standalone 回退副本**（供不经 w6_composition 的 standalone perception_bringup / air_bringup
# 使用），**须与真源一致**（由 `scripts/w6_geometry_check.py` 校验）。w6 运行路径的障碍文件
# 由真源**派生生成**（`w6_composition.write_derived_obstacles`），不读本副本。
#
# ---- R-006 静态先验（static 层）成文假设（2026-10-15）----
# 本文件所列障碍为**场景作者给定的静止障碍**（静态先验 / static 层），与几何真源
# src/agc_sim/config/world_geometry.yaml 一致、属**真值派生**（ADR-0020）。map_adapter **无论**
# obstacles_source 取 air_fusion 还是 config，都从本文件加载它们为**已知静态事实**，
# 并 **SHALL NOT** 因 /agc/obstacles 的**空数组 / 丢观测**而被清除（可见→遮挡→恢复时立柱仍在）。
# 注意：此为**非实时传感器**——假设**一次 run 内场景静止家具已知且不变**；该假设显式成文，
# **不得静默引入真值优势**（不依赖实时感知即可预知这些静止障碍的存在与几何）。
#
# 对齐旧树行为：旧 air_perception 从 scenario_file 读取静态障碍真值（非从 gazebo 取），
# 故本文件的位姿/尺寸**须与 src/agc_sim/worlds/agc_world.sdf** 中的静态障碍一致
# （pole_1 / pole_2，W3 打补丁后重排）。W6 若将障碍改为运行期 spawn/toggle，则应把本文件
# 指向对应场景描述。
obstacles:
  - id: pole_1
    x: 0.0
    y: -6.0
    z: 1.5
    yaw: 0.0
    size: [0.3, 0.3, 3.0]
  - id: pole_2
    x: 6.0
    y: 6.0
    z: 1.5
    yaw: 0.0
    size: [0.3, 0.3, 3.0]
