# W4 感知与融合参数 —— **唯一参数来源**
#
# 由 `perception_bringup.launch.py` 经 launch 单一注入；节点不得覆写（契约 [参数入口]）。
# 契约参数名 → 本文件节点参数映射：
#   `/agc/target/source`            → gt_adapter.target_source（air_fusion 同理）
#   `/agc/perception/sensors_file`  → air_perception.sensors_file（W4-b）
#   `/agc/obstacles/source`         → air_fusion / map_adapter（W4-b/c）

gt_bypass:
  ros__parameters:
    world_frame: "world"
    world_name: "agc_world"
    gz_topic: "/world/agc_world/dynamic_pose/info"
    out_topic_prefix: "/agc/gt/"
    entities: ["agc_car", "intruder_uav"]
    rate_hz: 30.0

ground_odom_adapter:
  ros__parameters:
    world_frame: "world"
    base_frame: "car/base_link"
    gt_topic: "/agc/gt/agc_car"
    odom_topic: "/agc/ground/odom"
    valid_topic: "/agc/ground/odom_valid"
    # R-039（ADR-0054）：诊断话题（latched std_msgs/String，state / age / epoch；非 ABI）
    diag_topic: "/agc/ground/odom_diag"
    # R-039：reset epoch 源（与 scenario_reset 一致，Int32 transient_local）→ 速度历史清空
    reset_epoch_topic: "/agc/scenario/reset_epoch"
    rate_hz: 30.0
    diff_window_s: 0.15
    odom_max_age_s: 0.5
    # R-039：相邻真值样本位移跳变阈值（m）；超过即视为 teleport → 速度历史清空
    reset_jump_clear_m: 0.5

gt_adapter:
  ros__parameters:
    world_frame: "world"
    target_model: "intruder_uav"
    target_id: "intruder_uav"
    gt_topic: "/agc/gt/intruder_uav"
    target_topic: "/agc/targets"
    target_source: "gt_adapter"      # 契约 /agc/target/source（launch 可覆写）
    rate_hz: 10.0
    pose_std_m: 0.01
    twist_std_m: 0.05
    diff_window_s: 0.15
# ---- W4-b · 感知与融合 ----
air_perception:
  ros__parameters:
    world_frame: "world"
    target_id: "intruder_uav"
    target_gt_topic: "/agc/gt/intruder_uav"
    drone_odom_topic: "/agc/air/odom"
    obs_topic: "/agc/air/obs"
    obs_hz: 20.0
    source_timeout_s: 0.3         # 感知源寿命：源采样时刻(Header.stamp)起算的失效期限（spec R-004）
    confidence_tolerance_m: 0.25
    seed: "0"
    # sensors_file / obstacles_file 由 launch 以绝对路径注入

air_fusion:
  ros__parameters:
    target_id: "intruder_uav"
    hz: 10.0
    target_max_age_s: 0.35        # 感知层内部新鲜度门控；须 <= 契约 C10 消费侧冻结阈值（spec R6）
    obs_max_age_s: 0.35
    gate_m: 1.5
    confidence_min: 0.5
    min_target_sources: 1
    obstacle_pad_m: 0.05
    correlated_pad_m: 0.05
    cold_start_min_agree: 2
    reference_hold_s: 1.0
    time_sync_tol_s: 0.15        # R-005：共同时刻对齐窗口（s）；候选采样时刻与最新者相差超过此值即不成组
    min_velocity_dt_s: 0.02      # R-005：速度差分最小 epoch 间隔（s）；低于此视为同刻/重发，保持上次速度
    confidence_tolerance_m: 0.25
    obs_topic: "/agc/air/obs"
    target_topic: "/agc/targets"
    obstacle_topic: "/agc/obstacles"
    world_frame: "world"
    # target_source / obstacles_source 由 launch 注入

# ---- W4-c · 地图 ----
map_adapter:
  ros__parameters:
    world_frame: "world"
    rate_hz: 2.0
    map_topic: "/agc/map"
    dynamic_max_age_s: 1.5       # R-006：动态障碍轨最后观测年龄超过此值即过期（→ 未知，非永久自由）；static 先验不过期
    source_max_age_s: 1.0        # R-006：/agc/obstacles 源静默超过此值 → /agc/map/valid=false（知识时效）
    # R-040（ADR-0055）：场景/源版本（折入内容身份 hash / 由 launch 按场景派生注入）；单调更新序号诊断话题
    scenario_version: ""
    update_seq_topic: "/agc/map/update_seq"
    # map_file / obstacles_file / obstacles_source 由 launch 注入
